name: Build iOS App

on:
  push:
    branches: [ main, master ]
    paths:
      - "Sources/**"
      - "project.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          set -eo pipefail
          xcodebuild \
            -project HisFootsteps.xcodeproj \
            -scheme HisFootsteps \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/HisFootsteps.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r HisFootsteps-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisFootsteps-unsigned-ipa
          path: HisFootsteps-unsigned.ipa
          retention-days: 14
