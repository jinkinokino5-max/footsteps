name: Build iOS App

on:
  push:
    branches: [ main, master ]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "project.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          echo "Available Xcode installs:"
          ls -d /Applications/Xcode_*.app 2>/dev/null || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          set -eo pipefail
          xcodebuild \
            -project HisFootsteps.xcodeproj \
            -scheme HisFootsteps \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Publish build log tail as annotation (readable without a token)
        if: always()
        run: |
          if [ -f build.log ]; then
            TAIL=$(tail -c 3500 build.log)
            ESCAPED="${TAIL//%/%25}"
            ESCAPED="${ESCAPED//$'\r'/%0D}"
            ESCAPED="${ESCAPED//$'\n'/%0A}"
            echo "::notice title=BuildLogTail::${ESCAPED}"
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/HisFootsteps.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r HisFootsteps-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisFootsteps-unsigned-ipa
          path: HisFootsteps-unsigned.ipa
          retention-days: 14
