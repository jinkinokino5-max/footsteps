name: HisFootsteps
options:
  bundleIdPrefix: com.hisfootsteps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  HisFootsteps:
    type: application
    platform: iOS
    sources:
      - path: Sources/HisFootsteps
      - path: Resources/Music
        type: folder
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: His Footsteps
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 「ファイル」アプリやFinder経由で曲を入れられるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hisfootsteps.app
        PRODUCT_NAME: HisFootsteps
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
